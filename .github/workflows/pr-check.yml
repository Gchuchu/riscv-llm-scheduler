name: PR Check
on:
  pull_request:
    branches: [main]
jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PR title format
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$TITLE" | grep -qE '^(feat|fix|docs|chore):\s'; then
            echo "ERROR: PR title must start with 'feat:', 'fix:', 'docs:', or 'chore:'"
            echo "Example: feat: implement kprobe trace for riscv_vstate_save"
            exit 1
          fi
          echo "PR title format OK"
